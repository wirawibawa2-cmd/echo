<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Echo · 3D Ghost Assistant</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Echo">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" href="assets/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<div id="app">
  <canvas id="scene" aria-label="3D ghost mascot. Tap to say hi, drag to spin."></canvas>

  <header class="top">
    <div class="brand">
      <span class="dot" id="statusDot"></span>
      <div>
        <div class="name" id="botName">Echo</div>
        <div class="status" id="statusText">Online</div>
      </div>
    </div>
    <div class="actions">
      <span class="chip" id="modeChip">Demo</span>
      <button class="icon-btn lang" id="langBtn" aria-label="Language">EN</button>
      <button class="icon-btn" id="muteBtn" aria-label="Mute voice">
        <svg viewBox="0 0 24 24" class="ic-on"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg viewBox="0 0 24 24" class="ic-off"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7zm7.4-2.5a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.5a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.5a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4-2.1-1.6z"/></svg>
      </button>
    </div>
  </header>

  <div class="hint" id="hint">Tap me · drag to spin</div>

  <div class="greet"><div class="g-hi">Hi, I'm Echo!</div><h1>How can I help<br>you today?</h1></div>
  <div class="chips" aria-label="Suggestions">
    <button type="button" data-q="Give me a quick productivity tip">⚡ Quick tip</button>
    <button type="button" data-q="Translate 'good morning, have a great day' to Bahasa Indonesia">🌐 Translate</button>
    <button type="button" data-q="Kasih ide konten Instagram untuk desain interior">💡 Ide konten</button>
    <button type="button" data-q="Tell me a short ghost joke">👻 Joke</button>
    <button type="button" data-q="Help me plan my day">🗓 Plan my day</button>
  </div>
  <div class="subtitle" id="subtitle"><span class="sub-name">Echo</span><p id="subText"></p></div>

  <section class="chat">
    <div class="log" id="log" aria-live="polite"></div>
    <form class="composer" id="composer" autocomplete="off">
      <button type="button" class="mic" id="micBtn" aria-label="Talk">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <input id="input" type="text" enterkeyhint="send" placeholder="Ask me anything…" aria-label="Message">
      <button type="submit" class="send" id="sendBtn" aria-label="Send">
        <svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5L4 12z"/></svg>
      </button>
    </form>
  </section>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <form class="sheet" id="sheet" hidden aria-label="Settings" onsubmit="return false">
    <div class="grab"></div>
    <h2>Settings</h2>
    <label class="field">
      <span>Gemini API key</span>
      <div class="keyrow">
        <input id="keyInput" type="password" autocomplete="new-password" placeholder="Paste your key (AIza…)" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button type="button" class="ghost-btn" id="showKeyBtn">Show</button>
      </div>
      <small>Free key: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>. Saved only on this phone (localStorage), never in the code.</small>
    </label>
    <label class="field">
      <span>Model</span>
      <select id="modelSelect"></select>
    </label>
    <label class="field row">
      <span>Remember chat on this phone</span>
      <input type="checkbox" id="persistChk">
    </label>
    <div class="btnrow">
      <button type="button" class="primary" id="saveBtn">Save</button>
      <button type="button" class="ghost-btn" id="clearKeyBtn">Remove key</button>
      <button type="button" class="ghost-btn" id="clearChatBtn">Clear chat</button>
    </div>
    <p class="fine" id="voiceInfo"></p>
  </form>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
